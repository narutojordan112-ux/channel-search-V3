<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 專業稅務配置系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { background-color: #4f46e5 !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        /* 強化輸入框顯示 */
        input[type="text"] { 
            font-size: 18px !important; 
            font-weight: 700;
            transition: all 0.2s; 
            border: 2px solid #e2e8f0;
        }
        input[type="text"]:focus { 
            border-color: #4f46e5; 
            background-color: white; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .card { background-color: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; padding: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="flex flex-col lg:flex-row min-h-screen">
        <aside class="w-full lg:w-72 bg-[#0F172A] text-white flex flex-col shrink-0">
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center">
                        <i data-lucide="split" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-tight">稅務策略分析</h1>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest">Double-Track v2026</p>
                    </div>
                </div>
            </div>
            
            <nav class="p-4 space-y-2 flex-1 overflow-x-auto lg:overflow-x-visible flex lg:flex-col gap-2 lg:gap-0">
                <div class="text-[10px] font-bold text-slate-500 px-4 py-2 uppercase tracking-widest hidden lg:block">個人資產配置</div>
                <button onclick="switchTab('individual')" id="btn-individual" class="tab-btn w-full flex items-center p-4 rounded-2xl transition-all gap-4 shrink-0 lg:shrink text-slate-400">
                    <i data-lucide="user" class="w-5 h-5"></i> <span class="font-bold text-sm">個人所得與 AMT</span>
                </button>
                
                <div class="text-[10px] font-bold text-slate-500 px-4 py-2 mt-4 uppercase tracking-widest hidden lg:block border-t border-slate-800 pt-6">法人帳戶配置</div>
                <button onclick="switchTab('corporate')" id="btn-corporate" class="tab-btn w-full flex items-center p-4 rounded-2xl transition-all gap-4 shrink-0 lg:shrink text-slate-400">
                    <i data-lucide="building" class="w-5 h-5"></i> <span class="font-bold text-sm">營所稅與 MAT</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <div class="flex-1 p-6 lg:p-10 overflow-y-auto">
                <div class="max-w-xl mx-auto space-y-8">
                    <div id="module-head">
                        <h2 id="m-title" class="text-2xl font-black text-slate-900 leading-tight">載入中...</h2>
                        <p id="m-desc" class="text-slate-500 text-sm italic mt-1"></p>
                    </div>

                    <div id="form-content" class="space-y-6">
                        </div>
                </div>
            </div>

            <div class="w-full lg:w-96 bg-white border-t lg:border-t-0 lg:border-l border-slate-200 p-8 lg:p-10 shrink-0 shadow-2xl">
                <h3 class="text-lg font-black text-slate-900 mb-6 flex items-center gap-2">
                    <i data-lucide="bar-chart-3" class="w-5 h-5 text-indigo-600"></i> 配置效能分析
                </h3>
                
                <div class="space-y-6">
                    <div class="h-44 w-full bg-slate-50 rounded-2xl p-4">
                        <canvas id="taxChart"></canvas>
                    </div>
                    
                    <div class="space-y-3 pt-4 border-t text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-medium text-xs">稅基淨額 (Base)</span>
                            <span id="res-base" class="font-mono font-bold text-slate-900">NT$ 0</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span id="label-exempt" class="text-slate-500 font-medium text-xs">免稅額度</span>
                            <span id="res-exempt" class="font-mono font-bold text-green-600">NT$ 0</span>
                        </div>
                    </div>

                    <div class="bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl shadow-indigo-100 relative overflow-hidden text-center">
                        <p id="label-final-tax" class="text-indigo-200 text-[10px] font-bold uppercase tracking-widest mb-1">最終預估稅額</p>
                        <p id="res-tax" class="text-3xl font-black font-mono">NT$ 0</p>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">配置規劃建議</h4>
                        <div id="expert-note" class="p-5 bg-slate-50 rounded-2xl text-[11px] leading-relaxed text-slate-600 border border-slate-100 italic">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentTab = 'individual';
        let taxChart = null;

        const CONFIG = {
            IND_AMT_EXEMPT: 7500000,
            CORP_MAT_EXEMPT: 600000,
            CORP_RATE: 0.20,
            CORP_MAT_RATE: 0.12
        };

        lucide.createIcons();

        // 強力格式化函數：即時增加逗號並保持游標位置
        function handleInput(e) {
            const input = e.target;
            let value = input.value.replace(/,/g, ''); // 去掉現有逗號
            
            // 唯有數字才處理
            if (!/^\d*$/.test(value)) {
                input.value = value.replace(/\D/g, '');
                return;
            }

            if (value === "") {
                input.value = "";
            } else {
                // 紀錄游標位置
                const selectionStart = input.selectionStart;
                const oldLength = input.value.length;
                
                // 格式化數字
                const formattedValue = Number(value).toLocaleString('en-US');
                input.value = formattedValue;
                
                // 調整游標位置，防止跳動
                const newLength = formattedValue.length;
                input.setSelectionRange(selectionStart + (newLength - oldLength), selectionStart + (newLength - oldLength));
            }
            calculate();
        }

        function getRawValue(id) {
            const el = document.getElementById(id);
            if (!el) return 0;
            return parseFloat(el.value.replace(/,/g, '')) || 0;
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById(`btn-${tabId}`).classList.add('tab-active');
            renderForm();
            calculate();
        }

        function renderForm() {
            const form = document.getElementById('form-content');
            const title = document.getElementById('m-title');
            const desc = document.getElementById('m-desc');

            if (currentTab === 'individual') {
                title.innerText = "個人所得與 AMT 分析";
                desc.innerText = "二、三層思考：比對綜所稅率與 20% AMT 門檻";
                form.innerHTML = `
                    <div class="card space-y-6">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide">綜合所得淨額 (國內)</label>
                            <input type="text" id="ind-net" value="2,000,000" oninput="handleInput(event)" class="w-full p-4 bg-slate-50 border-slate-100 rounded-2xl font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide">海外/特定投資所得 (AMT 項目)</label>
                            <input type="text" id="ind-overseas" value="0" oninput="handleInput(event)" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold focus:border-amber-500 outline-none">
                        </div>
                    </div>`;
            } else if (currentTab === 'corporate') {
                title.innerText = "法人營所稅與 MAT 分析";
                desc.innerText = "二、三層思考：評估 20% 營所稅與 12% 基本稅額";
                form.innerHTML = `
                    <div class="card space-y-6">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide">公司課稅所得額</label>
                            <input type="text" id="corp-net" value="2,000,000" oninput="handleInput(event)" class="w-full p-4 bg-slate-50 border-slate-100 rounded-2xl font-bold focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wide">免稅投資收益 (證交所得/海外所得)</label>
                            <input type="text" id="corp-exempt-inc" value="0" oninput="handleInput(event)" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold focus:border-amber-500 outline-none">
                        </div>
                    </div>`;
            }
        }

        function calculate() {
            let finalTax = 0, base = 0, exempt = 0, chartVals = [0, 0], note = "";

            if (currentTab === 'individual') {
                const net = getRawValue('ind-net');
                const overseas = getRawValue('ind-overseas');
                
                let regTax = 0;
                if (net <= 590000) regTax = net * 0.05;
                else if (net <= 1330000) regTax = net * 0.12 - 41300;
                else if (net <= 2660000) regTax = net * 0.20 - 147700;
                else regTax = net * 0.30 - 413700;

                let amtIncome = net + (overseas >= 1000000 ? overseas : 0);
                let amtTax = Math.max(0, (amtIncome - CONFIG.IND_AMT_EXEMPT) * 0.20);
                
                finalTax = Math.max(regTax, amtTax);
                base = amtIncome;
                exempt = CONFIG.IND_AMT_EXEMPT;
                chartVals = [regTax, amtTax];
                note = amtTax > regTax ? `⚠️ 已觸發 AMT！海外投資實質稅率為 20%，建議考慮分配至國內節稅工具。` : `✅ AMT 尚有額度，可考慮增加海外配置。`;

            } else if (currentTab === 'corporate') {
                const net = getRawValue('corp-net');
                const exemptInc = getRawValue('corp-exempt-inc');
                
                let regTax = net * CONFIG.CORP_RATE;
                let matIncome = net + exemptInc;
                let matTax = Math.max(0, (matIncome - CONFIG.CORP_MAT_EXEMPT) * CONFIG.CORP_MAT_RATE);
                
                finalTax = Math.max(regTax, matTax);
                base = matIncome;
                exempt = CONFIG.CORP_MAT_EXEMPT;
                chartVals = [regTax, matTax];
                note = matTax > regTax ? `⚠️ 已觸發 MAT！法人投資稅率 12%，優於個人 20%，資產可考慮放於法人戶。` : `✅ 法人戶目前僅負擔 20% 營所稅。`;
            }

            updateUI(finalTax, base, exempt, chartVals, note);
        }

        function updateUI(tax, base, exempt, chartVals, note) {
            document.getElementById('res-tax').innerText = 'NT$ ' + Math.floor(tax).toLocaleString();
            document.getElementById('res-base').innerText = 'NT$ ' + Math.floor(base).toLocaleString();
            document.getElementById('res-exempt').innerText = 'NT$ ' + Math.floor(exempt).toLocaleString();
            document.getElementById('expert-note').innerHTML = note;
            
            const ctx = document.getElementById('taxChart').getContext('2d');
            if (taxChart) taxChart.destroy();
            taxChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: currentTab === 'individual' ? ['一般所得稅', 'AMT 基本稅'] : ['營所稅 20%', 'MAT 12%'],
                    datasets: [{
                        data: chartVals,
                        backgroundColor: ['#e2e8f0', '#4f46e5'],
                        borderRadius: 10, barThickness: 35
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    scales: { y: { display: false }, x: { grid: { display: false } } } 
                }
            });
        }

        window.onload = () => switchTab('individual');
    </script>
</body>
</html>
